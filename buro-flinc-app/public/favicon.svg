<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flinc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004E89;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="white"/>
  
  <!-- Rounded container -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="url(#flinc-gradient)"/>
  
  <!-- F Letter -->
  <text x="32" y="32" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="central">F</text>
</svg>
